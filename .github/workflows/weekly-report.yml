name: Weekly Pilot Report

on:
  schedule:
    # Every Monday at 09:00 IST (= 03:30 UTC)
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date (YYYY-MM-DD). Leave empty for last 7 days."
        required: false
        default: ""
      to_date:
        description: "End date (YYYY-MM-DD). Leave empty for today."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  generate-report:
    name: Generate Weekly Pilot Report
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.REPORT_DATABASE_URL }}
        run: alembic upgrade head

      - name: Generate report
        env:
          REPORT_DATABASE_URL: ${{ secrets.REPORT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.REPORT_DATABASE_URL }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
        run: |
          if [ -n "$FROM_DATE" ] && [ -n "$TO_DATE" ]; then
            echo "Generating report for custom date range: $FROM_DATE to $TO_DATE"
            python -m supportpilot.reports.weekly --from "$FROM_DATE" --to "$TO_DATE" --out reports/
          else
            echo "Generating report for default date range"
            python -m supportpilot.reports.weekly --out reports/
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-pilot-report
          path: reports/
          if-no-files-found: error
