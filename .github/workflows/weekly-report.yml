name: Weekly Pilot Report

on:
  schedule:
    # Every Monday at 09:00 IST (= 03:30 UTC)
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      from_date:
        description: "Start date (YYYY-MM-DD). Leave empty for last 7 days."
        required: false
        default: ""
      to_date:
        description: "End date (YYYY-MM-DD). Leave empty for today."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  generate-report:
    name: Generate Weekly Pilot Report
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate report
        env:
          REPORT_DATABASE_URL: ${{ secrets.REPORT_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.REPORT_DATABASE_URL }}
        run: |
          if [ -n "${{ inputs.from_date }}" ] && [ -n "${{ inputs.to_date }}" ]; then
            echo "Generating report for custom date range: ${{ inputs.from_date }} to ${{ inputs.to_date }}"
            python -m supportpilot.reports.weekly --from "${{ inputs.from_date }}" --to "${{ inputs.to_date }}" --out reports/
          else
            echo "Generating report for the last 7 days"
            python -m supportpilot.reports.weekly --out reports/
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-pilot-report
          path: reports/
          if-no-files-found: error
