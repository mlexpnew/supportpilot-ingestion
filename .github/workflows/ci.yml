name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "test/**"
      - "cleanup/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check formatting
        run: python -m black --check .

      - name: Run linting
        run: python -m ruff check .

  docker:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t supportpilot-api .

      - name: Run container
        run: docker run -d -p 8000:8000 supportpilot-api

      - name: Call /health
        run: |
          sleep 3
          curl -sS --fail --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8000/health
